[package]
name = "openpdfedit-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-first PDF editing tools for AI agents, over the Model Context Protocol."

[[bin]]
name = "openpdfedit-mcp"
path = "src/main.rs"

[dependencies]
# The document crates, all pure Rust over lopdf. Deliberately NOT
# openpdfedit-engine: rendering needs PDFium, a C++ library fetched by a
# build script, and an MCP server people are asked to install should be one
# static binary with nothing to fetch. Everything here works without it.
openpdfedit-doc.workspace = true
openpdfedit-crypt.workspace = true
openpdfedit-pages.workspace = true
openpdfedit-batch.workspace = true

rmcp = { version = "3.1", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars = "1"
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
lopdf.workspace = true
tempfile = "3"
