description = "OCR pipeline: renders a page via openpdfedit-engine, runs Tesseract as a subprocess for word-level text + bounding boxes, and appends an invisible 'sandwich' text layer via openpdfedit-doc so a scanned page becomes searchable without changing how it looks."

