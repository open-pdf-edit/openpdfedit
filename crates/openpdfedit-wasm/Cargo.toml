[package]
name = "openpdfedit-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openpdfedit-engine = { path = "../openpdfedit-engine" }
# The engine-generic session core (open/save/render, no filesystem
# assumptions baked into the surface this crate calls) — see lib.rs's
# module doc for why this crate no longer talks to `openpdfedit-annot`/
# `openpdfedit-doc` directly the way the pre-Task-8 `WasmDocument` did.
openpdfedit-session = { path = "../openpdfedit-session" }
serde = { workspace = true }
serde_json = { workspace = true }

# wasm-only: this crate only ever runs on wasm32 in practice, but these
# are unconditional dependencies the same way shot-core's are (see that
# crate's Cargo.toml comment).
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }

# `lopdf` (transitively, via openpdfedit-session's own openpdfedit-doc/
# openpdfedit-annot/openpdfedit-forms/etc. dependencies) pulls in `rand`,
# which pulls in `getrandom`. getrandom's default backend has no
# wasm32-unknown-unknown support and fails to compile without this;
# declaring it directly here (even though this crate never calls it) is
# how Cargo's feature unification turns the "wasm_js" backend on for the
# transitive copy too.
getrandom = { version = "0.4", features = ["wasm_js"] }
