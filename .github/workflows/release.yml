# Builds the three release artifacts and attaches them to a GitHub
# Release whenever a v* tag is pushed (or on manual dispatch, which
# builds everything but only publishes a release when run from a tag):
#
#   - OpenPdfEdit_<version>_aarch64.dmg   (macOS desktop app)
#   - OpenPdfEdit_<version>_x64-setup.exe (Windows desktop installer, NSIS)
#   - openpdfedit-dist.zip                (Chrome extension, load-unpacked/store zip)
#
# The desktop jobs mirror scripts/build-dmg.sh and
# scripts/build-installer.ps1 (fetch PDFium → npm install → tauri build);
# the extension job mirrors apps/extension's `npm run package`
# (fetch-pdfium-wasm → wasm build with the PINNED wasm-bindgen-cli →
# SPA build → zip). Keep those scripts and this file in sync.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # build-wasm.sh hard-checks the CLI version against the workspace's
      # pinned `wasm-bindgen = "=0.2.126"` — install exactly that.
      - name: Install wasm-bindgen-cli (pinned to the workspace's wasm-bindgen)
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Fetch PDFium wasm binary
        run: scripts/fetch-pdfium-wasm.sh
      - name: Install frontend deps (desktop SPA + extension)
        run: |
          (cd apps/desktop && npm ci)
          (cd apps/extension && npm ci)
      - name: Build and package the extension zip
        working-directory: apps/extension
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: apps/extension/openpdfedit-dist.zip
          if-no-files-found: error

  macos-dmg:
    runs-on: macos-latest # arm64 (Apple Silicon)
    # On the job, not the steps: a step's own `env` is not in scope for its
    # own `if`, so every signing step below would skip itself.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch PDFium (native)
        run: scripts/fetch-pdfium.sh
      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci
      # --- Developer ID signing ------------------------------------------
      # Set the six APPLE_* repository secrets to ship a signed, notarized
      # build. With none of them set every step here is skipped and the
      # bundle keeps the ad-hoc identity from tauri.macos.conf.json, which
      # is what stops macOS calling a local build "damaged".
      - name: Import the Developer ID certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          # Our own keychain, not Tauri's: the PDFium dylib has to be signed
          # before the bundler runs, so the identity must already be usable
          # by then. APPLE_CERTIFICATE is deliberately not passed to the
          # build step below, so the bundler uses this one instead of
          # importing a second copy and swapping the search list under us.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign stops for a UI prompt no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Sign PDFium, the bundle's other binary
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          # Notarization rejects any nested Mach-O that is not signed with
          # the same identity and the hardened runtime. libpdfium.dylib is
          # copied into Contents/Resources by the bundler, so it is signed
          # here, at the source, and the app's own signature then seals it.
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" .vendor/pdfium/lib/libpdfium.dylib
          codesign --verify --strict --verbose=2 .vendor/pdfium/lib/libpdfium.dylib

      - name: Point the bundler at the Developer ID identity
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          # tauri.macos.conf.json pins the ad-hoc identity "-", and the
          # config beats APPLE_SIGNING_IDENTITY in the bundler — so a build
          # with every secret set would still ship ad-hoc signed and fail
          # notarization. The file is rewritten here rather than made
          # conditional, so a local build stays ad-hoc with no setup.
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("apps/desktop/src-tauri/tauri.macos.conf.json")
          conf = json.loads(p.read_text())
          conf["bundle"]["macOS"]["signingIdentity"] = os.environ["APPLE_SIGNING_IDENTITY"]
          p.write_text(json.dumps(conf, indent=2) + "\n")
          print(p.read_text())
          PY

      - name: Build the .dmg
        working-directory: apps/desktop
        env:
          # The Apple variables come from the job's env; only the updater
          # key is specific to this step.
          # Signs the update package. Separate from the Apple identity
          # above and required even without it: the updater refuses any
          # package this key did not sign, which is the whole reason an
          # app is allowed to download and run one.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          # Drop any Apple variable that arrived empty. GitHub
          # materializes an absent secret as an empty string, and Tauri
          # treats "present but empty" as "configured" — which turns a
          # missing credential into a *failed* notarization rather than a
          # skipped one, breaking the release for anyone who hasn't set
          # them up.
          for var in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!var}" ] || unset "$var"
          done
          # Always: the import step above already put it in a keychain the
          # bundler can see, and a second import swaps the search list.
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD

          # Not in that loop on purpose. An empty signing key is not a
          # skippable option the way an absent Apple identity is — the
          # build would succeed and emit an unsigned package that every
          # installed copy then refuses, which is a broken release that
          # looks like a working one.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set; the update package would be unsigned." >&2
            exit 1
          fi
          # `app` as well as `dmg`: the updater's macOS artifact is a
          # tarball of the .app, and asking only for the dmg produces the
          # installer but nothing for an existing install to update from.
          npm run tauri build -- --bundles app,dmg
      - name: Notarize and staple the .dmg
        if: env.APPLE_ID != ''
        run: |
          # The bundler notarizes and staples the .app, and then builds the
          # .dmg around it — so the disk image itself carries no ticket.
          # Online that still passes, because Gatekeeper asks Apple; on a
          # machine with no network the first thing a new user sees is
          # "cannot be opened". The image is its own notarization subject,
          # so it is submitted and stapled here.
          dmg="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"

      - name: Check what was actually signed
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          # "It built" is not "it opens on a stranger's Mac". Gatekeeper's
          # own verdict is what these answer, and stapler answers for the
          # machine that is offline when it opens the download.
          app="$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          dmg="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|Runtime|flags'
          spctl --assess --type exec --verbose=4 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-updater
          path: target/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # fetch-pdfium.sh is deliberately shared with Windows via git-bash
      # (see build-installer.ps1's comment) — runners ship bash.exe.
      - name: Fetch PDFium (native)
        shell: bash
        run: scripts/fetch-pdfium.sh
      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci
      - name: Build the NSIS installer (.exe)
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
          if-no-files-found: error

  release:
    # Only publish a Release for real tag pushes; a workflow_dispatch run
    # still builds and uploads the three artifacts for inspection.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [extension, macos-dmg, windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build latest.json, which is what an installed copy reads
        run: |
          set -euo pipefail
          # The tag minus its leading v. The updater compares this against
          # the running app's version, so it has to be the bare semver —
          # "v0.1.12" never compares greater than "0.1.11".
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          mac_tar="$(ls artifacts/*.app.tar.gz 2>/dev/null | head -1 || true)"
          win_exe="$(ls artifacts/*-setup.exe 2>/dev/null | head -1 || true)"

          platforms=""
          if [ -n "$mac_tar" ] && [ -f "${mac_tar}.sig" ]; then
            platforms="$(printf '"darwin-aarch64":{"signature":"%s","url":"%s/%s"}' \
              "$(cat "${mac_tar}.sig")" "$BASE" "$(basename "$mac_tar")")"
          fi
          if [ -n "$win_exe" ] && [ -f "${win_exe}.sig" ]; then
            [ -n "$platforms" ] && platforms="${platforms},"
            platforms="${platforms}$(printf '"windows-x86_64":{"signature":"%s","url":"%s/%s"}' \
              "$(cat "${win_exe}.sig")" "$BASE" "$(basename "$win_exe")")"
          fi

          # An empty manifest is worse than none: the app would fetch it,
          # find no platform entry, and report "up to date" forever.
          if [ -z "$platforms" ]; then
            echo "no signed updater artifacts found — refusing to publish an empty latest.json" >&2
            ls -la artifacts/ >&2
            exit 1
          fi

          printf '{"version":"%s","pub_date":"%s","platforms":{%s}}\n' \
            "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$platforms" > artifacts/latest.json
          echo "--- latest.json ---"
          cat artifacts/latest.json

      - name: Create the GitHub Release with all three artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la artifacts/

          # An annotated tag's message becomes the release notes, so what
          # changed is written once, at the point a release is cut,
          # instead of every release repeating the same blurb.
          #
          # Read through the API rather than from a checkout: v0.1.3
          # shipped with its commit message as the release body because
          # actions/checkout materializes the tag as a *lightweight* ref
          # pointing straight at the commit, so `git tag --format` hands
          # back the commit's message instead of the annotation — and
          # being non-empty, it sailed past the fallback below. The API
          # reports the ref's true object type, so a lightweight tag is
          # detected rather than silently mistaken for an annotated one.
          NOTES=""
          TAG_TYPE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq '.object.type' 2>/dev/null || true)"
          if [ "$TAG_TYPE" = "tag" ]; then
            TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
              --jq '.object.sha')"
            NOTES="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_SHA" --jq '.message')"
          fi
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            NOTES="Local-first PDF editor. Downloads: the macOS app (.dmg, Apple Silicon), the Windows installer (.exe), and the Chrome extension (unzip, then chrome://extensions → Developer mode → Load unpacked). Chrome 103+. Documents never leave your machine."
          fi

          # A tag with a suffix — v0.1.10-rc1 — is a candidate, not a
          # release. Without --prerelease it would be marked Latest, and
          # the site's Download buttons follow releases/latest, so a tag
          # cut to test something would become what everybody downloads.
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            v*.*.*-*) PRERELEASE="--prerelease" ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenPdfEdit $GITHUB_REF_NAME" \
            --notes "$NOTES" \
            $PRERELEASE \
            artifacts/* \
          || gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*
